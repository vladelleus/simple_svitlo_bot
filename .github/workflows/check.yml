name: Перевірка відключень

on:
  # Triggered every 5 min by cron-job.org via the workflow_dispatch API:
  # GitHub's own schedule trigger was delayed or skipped too often
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svitlo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Перевірити графік і відключення
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBQUEUE: ${{ vars.SUBQUEUE || '2.2' }}
          REMIND_MINUTES: ${{ vars.REMIND_MINUTES || '30' }}
          # Kept in repo secrets (or variables), not here: the repo is public
          CITY_ID: ${{ secrets.CITY_ID || vars.CITY_ID }}
          STREET_ID: ${{ secrets.STREET_ID || vars.STREET_ID }}
          BUILDING: ${{ secrets.BUILDING || vars.BUILDING }}
        run: python svitlo.py

      - name: Зберегти стан
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Оновити стан"
            git pull --rebase
            git push
          fi
